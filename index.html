<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLTK – Cày Tiền Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap');

:root {
  --gold: #c9a227;
  --gold-light: #f0d070;
  --dark: #0d0a07;
  --panel: #171009;
  --panel2: #1f1509;
  --border: #4a3408;
  --male: #3a8fd4;
  --male-dim: #1a4a70;
  --female: #d4609a;
  --female-dim: #7a2a55;
  --green: #3a9a3a;
  --green-bright: #5ccf5c;
  --orange: #e07830;
  --text: #e5d09a;
  --text-dim: #907840;

  /* trạng thái */
  --s-running-bg: rgba(224,120,48,0.13);
  --s-running-border: #7a4010;
  --s-done-bg: rgba(30,80,20,0.3);
  --s-done-border: #2a5a1a;
  --s-wait-bg: #1f1509;
  --s-wait-border: #2a1c08;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(58,143,212,0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 90%, rgba(212,96,154,0.07) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c9a227' fill-opacity='0.025'%3E%3Cpath d='M40 38v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V4h-2v4h-4v2h4v4h2v-4h4V4h-4z'/%3E%3C/g%3E%3C/svg%3E");
  padding: 14px 10px 30px;
}

/* HEADER */
header {
  text-align: center;
  padding: 14px 0 10px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
header::before { content:'⚔'; color:var(--male); position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1.1rem; }
header::after  { content:'♦'; color:var(--female); position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:1.1rem; }
h1 { font-family:'Ma Shan Zheng',serif; font-size:1.7rem; color:var(--gold-light); text-shadow:0 0 18px rgba(201,162,39,0.45); letter-spacing:2px; }
.subtitle { font-size:0.7rem; color:var(--text-dim); margin-top:3px; }

/* SUMMARY BAR */
.summary {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 7px;
  max-width: 500px;
  margin: 0 auto 16px;
}
.s-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 4px; text-align:center; }
.s-num { font-size:1.4rem; font-weight:700; line-height:1; }
.s-lbl { font-size:0.6rem; color:var(--text-dim); margin-top:2px; }
.c-orange { color: var(--orange); }
.c-green  { color: var(--green-bright); }
.c-dim    { color: var(--text-dim); }
.c-gold   { color: var(--gold); }

/* LEGEND */
.legend {
  display: flex; gap: 10px; justify-content: center;
  margin-bottom: 14px; flex-wrap: wrap;
}
.legend-item { display:flex; align-items:center; gap:5px; font-size:0.65rem; color:var(--text-dim); }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.dot-running { background:var(--orange); }
.dot-done    { background:var(--green-bright); }
.dot-wait    { background:var(--text-dim); }

/* SLOT HINT BAR */
.slot-hint {
  max-width: 500px; margin: 0 auto 16px;
  background: var(--panel); border:1px solid var(--border);
  border-radius:9px; padding: 9px 14px;
  font-size: 0.72rem; color: var(--text-dim);
  text-align: center; line-height: 1.7;
}
.slot-hint b { color: var(--gold); }
.slot-hint .free { color: var(--orange); font-weight:700; }

/* ARENA */
.arena {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 780px;
  margin: 0 auto;
}

/* DÀN */
.dan { background:var(--panel); border-radius:12px; overflow:hidden; border:1px solid var(--border); }
.dan-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 12px; border-bottom:1px solid var(--border);
}
.dan-male .dan-header   { background: linear-gradient(135deg,#0d1e30,#0f1520); }
.dan-female .dan-header { background: linear-gradient(135deg,#2a0e1a,#1a0a12); }
.dan-title { font-family:'Ma Shan Zheng',serif; font-size:1rem; font-weight:700; letter-spacing:1px; }
.dan-male .dan-title   { color:var(--male); }
.dan-female .dan-title { color:var(--female); }
.dan-slots {
  font-size:0.65rem; color:var(--text-dim);
  display:flex; gap:6px; align-items:center;
}
.slot-pip {
  width:8px; height:8px; border-radius:50%;
  border:1.5px solid var(--border);
  background: var(--dark);
  display:inline-block;
}
.slot-pip.occupied { background:var(--orange); border-color:var(--orange); }

/* ACC LIST */
.acc-list { padding:8px 8px 6px; display:flex; flex-direction:column; gap:5px; }

/* ACC ROW — 3 trạng thái */
.acc-row {
  display:flex; align-items:center; gap:7px;
  border-radius:7px; padding:7px 9px;
  border:1px solid var(--s-wait-border);
  background:var(--s-wait-bg);
  cursor:pointer; user-select:none;
  transition: all 0.18s;
  position:relative;
}
.acc-row:active { transform:scale(0.98); }

.acc-row.running {
  background:var(--s-running-bg);
  border-color:var(--s-running-border);
}
.acc-row.done {
  background:var(--s-done-bg);
  border-color:var(--s-done-border);
}

/* pulse cho running */
@keyframes pulse-run {
  0%,100% { box-shadow:0 0 3px rgba(224,120,48,0.2); }
  50%      { box-shadow:0 0 9px rgba(224,120,48,0.6); }
}
.acc-row.running { animation: pulse-run 2.5s infinite; }

/* BADGE số thứ tự */
.acc-badge {
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.72rem; font-weight:700; flex-shrink:0;
  border:1.5px solid; background:var(--dark);
}
.dan-male   .acc-badge { border-color:var(--male-dim); color:var(--male); }
.dan-female .acc-badge { border-color:var(--female-dim); color:var(--female); }
.running .acc-badge { border-color:var(--orange)!important; color:var(--orange)!important; }
.done    .acc-badge { border-color:var(--green)!important; color:var(--green-bright)!important; background:rgba(20,60,10,0.5)!important; }

/* STATUS ICON */
.acc-status-icon { font-size:0.85rem; flex-shrink:0; width:18px; text-align:center; }

/* NAME */
.acc-name {
  flex:1; font-size:0.78rem; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.done .acc-name { color:var(--text-dim); text-decoration:line-through; text-decoration-color:#3a5a2a; }
.running .acc-name { color:#f0c060; }

/* BUTTONS */
.acc-btn {
  background:none; border:none; font-size:0.75rem;
  color:var(--text-dim); cursor:pointer; padding:2px 3px;
  border-radius:3px; flex-shrink:0; transition:color 0.15s; line-height:1;
}
.acc-btn:hover { color:var(--gold); }
.has-note { color:var(--gold)!important; }

/* STATE TOGGLE BUTTON — bấm để chuyển trạng thái */
.acc-toggle {
  width:22px; height:22px; border-radius:5px;
  border:1.5px solid var(--border); background:var(--dark);
  display:flex; align-items:center; justify-content:center;
  font-size:0.72rem; flex-shrink:0;
  cursor:pointer; transition:all 0.18s;
}
.running .acc-toggle { border-color:var(--orange); color:var(--orange); }
.done    .acc-toggle { border-color:var(--green-bright); color:var(--green-bright); background:rgba(20,60,10,0.5); }

/* NOTE */
.note-area { display:none; padding:0 4px 6px; }
.note-area.open { display:block; }
.note-input {
  width:100%; background:var(--dark);
  border:1px solid var(--border); border-radius:5px;
  color:var(--text); font-family:inherit; font-size:0.72rem;
  padding:5px 8px; resize:none; outline:none;
}
.note-input:focus { border-color:var(--gold); }
.note-input::placeholder { color:var(--text-dim); }

/* MODAL */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.75); z-index:100;
  align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:#1a1208; border:1px solid var(--gold);
  border-radius:12px; padding:22px 20px 18px;
  width:min(320px,90vw);
  box-shadow:0 0 30px rgba(201,162,39,0.2);
}
.modal-title { font-size:0.8rem; color:var(--gold); letter-spacing:1px; margin-bottom:12px; text-align:center; }
.modal-input {
  width:100%; background:var(--dark); border:1px solid var(--border);
  border-radius:7px; color:var(--text); font-family:inherit; font-size:1rem;
  padding:9px 12px; outline:none; margin-bottom:14px;
}
.modal-input:focus { border-color:var(--gold); }
.modal-btns { display:flex; gap:8px; justify-content:flex-end; }
.modal-btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:0.8rem; padding:7px 16px; border-radius:7px; cursor:pointer; transition:all 0.15s; }
.modal-btn-ok { border-color:var(--gold); color:var(--gold); }
.modal-btn-ok:hover { background:rgba(201,162,39,0.15); }

/* BOTTOM */
.bottom-bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px; max-width:780px; margin-left:auto; margin-right:auto; }
.btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:0.75rem; padding:8px 14px; border-radius:7px; cursor:pointer; transition:all 0.18s; }
.btn:hover { border-color:var(--gold); color:var(--gold); }
.btn-red:hover { border-color:#e05050; color:#e05050; }
.last-reset { font-size:0.63rem; color:var(--text-dim); text-align:center; margin-top:10px; }

/* MOBILE */
@media(max-width:500px) { h1{font-size:1.3rem;} .arena{gap:8px;} .acc-name{font-size:0.72rem;} }
@media(max-width:360px) { .arena{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header>
  <h1>Võ Lâm Cày Tiền</h1>
  <div class="subtitle">16 acc · 8 Nam + 8 Nữ · Tối đa 4 Nam + 4 Nữ cùng lúc</div>
</header>

<div class="summary">
  <div class="s-card">
    <div class="s-num c-orange" id="s-running">0</div>
    <div class="s-lbl">▶ Đang chạy</div>
  </div>
  <div class="s-card">
    <div class="s-num c-green" id="s-done">0</div>
    <div class="s-lbl">✓ Xong</div>
  </div>
  <div class="s-card">
    <div class="s-num c-dim" id="s-wait">16</div>
    <div class="s-lbl">⏳ Chờ</div>
  </div>
  <div class="s-card">
    <div class="s-num c-gold" id="s-free">4+4</div>
    <div class="s-lbl">Slot trống</div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot dot-running"></span> Đang chạy (bấm → Xong)</div>
  <div class="legend-item"><span class="legend-dot dot-done"></span> Xong (bấm → Chờ)</div>
  <div class="legend-item"><span class="legend-dot dot-wait"></span> Chờ (bấm → Chạy)</div>
</div>

<div class="slot-hint" id="slot-hint">Đang tính...</div>

<div class="arena" id="arena"></div>

<div class="bottom-bar">
  <button class="btn" onclick="resetAllToWait()">🔄 Reset chu kỳ mới</button>
  <button class="btn" onclick="exportState()">📋 Copy trạng thái</button>
</div>
<div class="last-reset" id="last-reset-text"></div>

<!-- MODAL SỬA TÊN -->
<div class="modal-overlay" id="edit-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">✏️ Đổi tên account</div>
    <input class="modal-input" id="modal-input" type="text" maxlength="30" placeholder="Nhập tên mới..." onkeydown="if(event.key==='Enter')saveModalName()">
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Huỷ</button>
      <button class="modal-btn modal-btn-ok" onclick="saveModalName()">✓ Lưu</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
// status: 0 = chờ, 1 = đang chạy, 2 = xong

const STORAGE_KEY = 'vltk_v4';
const MAX_SLOTS = 4; // tối đa mỗi giới

function defaultState() {
  return {
    status: Array(16).fill(0),
    notes:  Array(16).fill(''),
    names: [
      'Nam 1','Nam 2','Nam 3','Nam 4','Nam 5','Nam 6','Nam 7','Nam 8',
      'Nữ 1','Nữ 2','Nữ 3','Nữ 4','Nữ 5','Nữ 6','Nữ 7','Nữ 8'
    ],
    lastReset: null
  };
}

function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch(e){}
  return defaultState();
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();

// ── CYCLE: 0(chờ) → 1(chạy) → 2(xong) → 0(chờ)
// Khi chuyển sang chạy: kiểm tra giới hạn slot
function cycleStatus(i) {
  const cur = state.status[i];
  const gender = i < 8 ? 'male' : 'female';
  const offset = i < 8 ? 0 : 8;

  if (cur === 0) {
    // chờ → chạy: check giới hạn 4 slot
    const running = state.status.slice(offset, offset+8).filter(s => s===1).length;
    if (running >= MAX_SLOTS) {
      showSlotFull(gender);
      return;
    }
    state.status[i] = 1;
  } else if (cur === 1) {
    // chạy → xong
    state.status[i] = 2;
  } else {
    // xong → chờ (nếu cần reset 1 acc)
    state.status[i] = 0;
  }
  save(); render();
}

function showSlotFull(gender) {
  const g = gender === 'male' ? 'Nam' : 'Nữ';
  alert(`⚠️ Dàn ${g} đã đủ 4 slot đang chạy!\nHãy đánh dấu xong 1 acc trước khi thêm mới.`);
}

// ── RENDER ──
function render() {
  const arena = document.getElementById('arena');
  arena.innerHTML = '';

  const maleStatus   = state.status.slice(0,8);
  const femaleStatus = state.status.slice(8,16);

  const mRunning = maleStatus.filter(s=>s===1).length;
  const fRunning = femaleStatus.filter(s=>s===1).length;
  const mFree = MAX_SLOTS - mRunning;
  const fFree = MAX_SLOTS - fRunning;
  const totalRunning = mRunning + fRunning;
  const totalDone    = state.status.filter(s=>s===2).length;
  const totalWait    = state.status.filter(s=>s===0).length;

  document.getElementById('s-running').textContent = totalRunning;
  document.getElementById('s-done').textContent    = totalDone;
  document.getElementById('s-wait').textContent    = totalWait;
  document.getElementById('s-free').textContent    = `${mFree}+${fFree}`;

  // Slot hint
  const hints = [];
  if (mFree > 0 && maleStatus.some(s=>s===0))
    hints.push(`<span class="free">Nam còn ${mFree} slot</span> — kéo ${mFree} acc Nam vào`);
  if (fFree > 0 && femaleStatus.some(s=>s===0))
    hints.push(`<span class="free">Nữ còn ${fFree} slot</span> — kéo ${fFree} acc Nữ vào`);
  if (hints.length === 0 && totalDone < 16)
    hints.push('<b>Đang full tải</b> · Đợi acc nào xong thì swap mới vào');
  if (totalDone === 16)
    hints.push('🎉 <b>Xong cả 16 acc!</b> · Reset chu kỳ mới nào');
  document.getElementById('slot-hint').innerHTML = hints.join('<br>') || '–';

  renderDan(arena, 'male',   0, '⚔ Nam',  mRunning, mFree);
  renderDan(arena, 'female', 8, '♦ Nữ',   fRunning, fFree);

  // Last reset
  const el = document.getElementById('last-reset-text');
  el.textContent = state.lastReset
    ? 'Reset lần cuối: ' + new Date(state.lastReset).toLocaleString('vi-VN')
    : 'Chưa reset chu kỳ nào';
}

function renderDan(container, gender, offset, title, running, free) {
  const dan = document.createElement('div');
  dan.className = `dan dan-${gender}`;

  // Slot pips
  let pips = '';
  for(let p=0; p<MAX_SLOTS; p++) {
    pips += `<span class="slot-pip${p < running ? ' occupied':''}"></span>`;
  }

  dan.innerHTML = `
    <div class="dan-header">
      <div class="dan-title">${title}</div>
      <div class="dan-slots">${pips} <span style="margin-left:2px">${running}/4</span></div>
    </div>
    <div class="acc-list" id="acclist-${gender}"></div>
  `;
  container.appendChild(dan);

  const list = dan.querySelector(`#acclist-${gender}`);

  // Sắp xếp: running trước, wait sau, done cuối
  const indices = Array.from({length:8},(_,k)=>offset+k);
  indices.sort((a,b) => {
    const order = {1:0, 0:1, 2:2};
    return order[state.status[a]] - order[state.status[b]];
  });

  for (const i of indices) {
    const st = state.status[i];
    const serial = i - offset + 1;
    const hasNote = !!(state.notes[i] && state.notes[i].trim());
    const stClass = st===1 ? 'running' : st===2 ? 'done' : '';
    const stIcon  = st===1 ? '▶' : st===2 ? '✓' : '·';
    const toggleTip = st===0 ? 'Bắt đầu chạy' : st===1 ? 'Đánh dấu xong' : 'Đặt lại chờ';

    const row = document.createElement('div');
    row.className = `acc-row ${stClass}`;

    row.innerHTML = `
      <div class="acc-badge">${serial}</div>
      <div class="acc-status-icon">${stIcon}</div>
      <div class="acc-name">${escHtml(state.names[i])}</div>
      <button class="acc-btn" onclick="openEditModal(event,${i})" title="Sửa tên">✏️</button>
      <button class="acc-btn ${hasNote?'has-note':''}" onclick="toggleNote(event,${i})" title="Ghi chú">📝</button>
      <div class="acc-toggle" title="${toggleTip}">${stIcon}</div>
    `;

    // Bấm toggle (ô vuông bên phải) hoặc toàn row
    row.addEventListener('click', e => {
      if(e.target.classList.contains('acc-btn')) return;
      cycleStatus(i);
    });

    list.appendChild(row);

    // Note area
    const noteDiv = document.createElement('div');
    noteDiv.className = 'note-area';
    noteDiv.id = `note-${i}`;
    noteDiv.innerHTML = `<textarea class="note-input" rows="2" placeholder="Ghi chú: lag, lỗi, bị kick..." oninput="state.notes[${i}]=this.value;save()">${escHtml(state.notes[i]||'')}</textarea>`;
    list.appendChild(noteDiv);
  }
}

// ── MODAL ──
let _editIdx = -1;
function openEditModal(e, i) {
  e.stopPropagation();
  _editIdx = i;
  const gender = i < 8 ? 'Nam' : 'Nữ';
  const serial = i < 8 ? i+1 : i-7;
  document.getElementById('modal-title').textContent = `✏️ Đổi tên ${gender} ${serial}`;
  const inp = document.getElementById('modal-input');
  inp.value = state.names[i];
  document.getElementById('edit-modal').classList.add('open');
  setTimeout(()=>{ inp.focus(); inp.select(); }, 80);
}
function saveModalName() {
  if(_editIdx<0) return;
  const val = document.getElementById('modal-input').value.trim();
  const gender = _editIdx<8?'Nam':'Nữ';
  const serial = _editIdx<8?_editIdx+1:_editIdx-7;
  state.names[_editIdx] = val || `${gender} ${serial}`;
  save(); render(); closeModal();
}
function closeModal(e) {
  if(e && e.target!==document.getElementById('edit-modal')) return;
  document.getElementById('edit-modal').classList.remove('open');
  _editIdx = -1;
}

// ── NOTE ──
function toggleNote(e, i) {
  e.stopPropagation();
  const a = document.getElementById(`note-${i}`);
  a.classList.toggle('open');
  if(a.classList.contains('open')) a.querySelector('textarea').focus();
}

// ── RESET ──
function resetAllToWait() {
  if(!confirm("Reset chu kỳ mới?\nTất cả acc về trạng thái Chờ.\n(Tên và ghi chú được giữ lại)")) return;
  state.status = Array(16).fill(0);
  state.lastReset = new Date().toISOString();
  save(); render();
}

// ── EXPORT ──
function exportState() {
  const stLabel = ['⏳','▶','✓'];
  const genders = ['Nam','Nữ'];
  const lines = ['=== VLTK Tracker ' + new Date().toLocaleString('vi-VN') + ' ==='];
  for(let g=0;g<2;g++) {
    lines.push(`\n── ${genders[g]} ──`);
    for(let k=0;k<8;k++) {
      const i = g*8+k;
      const note = state.notes[i] ? ` [${state.notes[i]}]` : '';
      lines.push(`  ${stLabel[state.status[i]]} ${state.names[i]}${note}`);
    }
  }
  const text = lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>alert('Đã sao chép!'));
  else prompt('Copy nội dung:', text);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();
</script>
